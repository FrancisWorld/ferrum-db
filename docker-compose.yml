services:
  ferrum:
    build: .
    image: ferrum-db:local
    container_name: ferrum-db
    command: ["--aof", "--aof-fsync", "${FERRUM_AOF_FSYNC:-everysec}", "--maxmemory", "${FERRUM_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    environment:
      FERRUM_REQUIREPASS: ${FERRUM_REQUIREPASS:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${FERRUM_HOST_PORT:-6380}:6380"
    volumes:
      - ferrum-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ferrum-data:
